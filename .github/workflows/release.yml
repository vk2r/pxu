name: Release

# Pushing a tag vX.Y.Z builds the static binary and tests it (job build, read-only token, no
# secrets), then a second job that never checks out or runs repository code attests the built
# files with GitHub's build provenance and publishes the release. Nothing is committed back.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
          cache: false

      - name: Audit
        run: mise run audit

      - name: Test
        run: mise run check

      - name: Lint
        run: mise run lint

      # Static musl binary: runs on Proxmox 8 (glibc 2.36) and 9 (glibc 2.41).
      - name: Build
        run: mise run release-build

      - name: Package
        run: mise run package

      # Only built files leave this job. The jobs below do not check out or run repo code.
      - name: Stage files to publish
        run: |
          mkdir -p target/stage
          cp target/package/pxu target/package/*.tar.gz target/package/SHA256SUMS target/stage/
          cp install.sh target/stage/install.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: target/stage/
          if-no-files-found: error
          retention-days: 1

  # No checkout and no repo code: it only handles the files built above.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: target/package

      - name: Restore the executable bit (artifacts do not keep it)
        run: chmod +x target/package/pxu

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/package/pxu
            target/package/*.tar.gz

      - name: Keep the signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" target/package/provenance.sigstore.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd target/package
          cat > notes.md <<NOTES
          Static x86_64 binary (musl), built from this tag by .github/workflows/release.yml and attested with GitHub build provenance.

          Verify after downloading the files:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          gh attestation verify pxu --repo $GITHUB_REPOSITORY --bundle provenance.sigstore.json
          gh attestation verify pxu-*-x86_64-linux.tar.gz --repo $GITHUB_REPOSITORY --bundle provenance.sigstore.json
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            pxu pxu-*-x86_64-linux.tar.gz SHA256SUMS provenance.sigstore.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # Publishes this tag's install.sh on GitHub Pages, so the latest release installs with
  # curl -fsSL https://vk2r.github.io/pxu/install.sh | sh
  # Runs only after the release is published: the script downloads that release.
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install.sh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: target/dl

      - name: Site with install.sh
        run: mkdir -p target/pages && cp target/dl/install.sh target/pages/install.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
