[package]
name = "pxu"
version = "1.0.6"
edition = "2021"
license = "MIT"

[features]
# MockHost y World (host simulado en memoria). Siempre disponible en debug/tests; en release solo con --features mock.
mock = []

[dependencies]
ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
] }
crossterm = { version = "0.28", default-features = false }
serde = { version = "1", default-features = false, features = [
    "derive",
    "std",
] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = { version = "0.22", default-features = false, features = [
    "parse",
    "display",
] }
serde_json = { version = "1", default-features = false, features = ["std"] }
lexopt = "0.3"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Binario de pruebas con MockHost (`cargo build --profile mock --features mock` → target/mock/pxu).
# Nunca comparte directorio con target/release/pxu, que es el binario de producción.
[profile.mock]
inherits = "release"
debug-assertions = true
