# Toolchain y tareas de pxu. Proxmox solo necesita el binario; nada de esto va al servidor.
#   mise install        instala las herramientas de abajo
#   mise tasks          lista las tareas
[tools]
rust = { version = "1.99.1", targets = "x86_64-unknown-linux-musl", components = "clippy" }
"github:charmbracelet/freeze" = "0.2.2"
"github:rustsec/rustsec" = { version = "0.23.0", version_prefix = "cargo-audit/v", bin = "cargo-audit" }

[tasks.build]
description = "Compila el binario de producción en target/release/pxu"
run = "cargo build --locked --release && ls -l target/release/pxu"

[tasks.release-build]
description = "Compila el binario estático de la release (musl) en target/x86_64-unknown-linux-musl/release/pxu"
run = "cargo build --locked --release --target x86_64-unknown-linux-musl"

[tasks.package]
description = "Empaqueta la release en target/package: pxu, tarball y SHA256SUMS"
depends = ["release-build"]
run = "tools/package.sh"

[tasks.publish]
description = "Sube main a Forgejo (el espejo lo lleva a GitHub); con -- v1.2.3 también pone esa versión en Cargo.toml, hace commit, crea y sube el tag, que lanza la release"
usage = 'arg "[tag]" help="Tag de la versión, p. ej. v1.0.0"'
run = 'tools/publish.sh ${usage_tag}'

[tasks.test]
description = "Corre los tests en el perfil dev y en el perfil mock"
env = { TZ = "America/Santiago" }
run = [
    "cargo test --locked",
    "cargo test --locked --profile mock --features mock",
]

[tasks.mock]
description = "Compila el binario de pruebas con MockHost en target/mock/pxu"
run = "cargo build --locked --profile mock --features mock"

[tasks.demo]
description = "Abre la TUI con un servidor simulado (mise run demo -- update-ok update --yes)"
depends = ["mock"]
usage = 'arg "[args]..." var=#true default="demo" help="Caso simulado y comando"'
run = 'target/mock/pxu --mock ${usage_args}'

[tasks.audit]
description = "Revisa las dependencias de Cargo.lock contra la base de avisos de RustSec"
run = "cargo audit"

[tasks.lint]
description = "Avisos de clippy (todavía no son bloqueantes)"
run = "cargo clippy --locked --all-targets"

[tasks.check]
description = "Tests y comprobación de que el binario de producción rechaza --mock"
run = [
    "mise run test",
    "cargo build --locked --release",
    "code=0; target/release/pxu --mock demo list 2>/dev/null || code=$?; test $code -eq 2 && echo \"release rechaza --mock (exit 2)\"",
]

[tasks.screenshots]
description = "Regenera screenshots/*.png desde el mock (tmux + freeze, sin tocar el escritorio)"
depends = ["mock"]
run = "screenshots/screenshots.sh"
